            <!-- 游戏画布区域 -->
            <div class="game-viewport" id="gameViewport">
                <canvas id="catGameCanvas" width="480" height="260"></canvas>
                
                <!-- Doodle Jump 双向控制按键 -->
                <div class="touch-controls" id="touchControls">
                    <button class="touch-btn" id="btnLeft">◀</button>
                    <button class="touch-btn" id="btnRight">▶</button>
                </div>

                <!-- 猫猫游行 十字按键 -->
                <div class="dpad-controls" id="dpadControls">
                    <button class="dpad-btn dpad-up" id="btnUp">▲</button>
                    <button class="dpad-btn dpad-left" id="btnDpadLeft">◀</button>
                    <button class="dpad-btn dpad-right" id="btnDpadRight">▶</button>
                    <button class="dpad-btn dpad-down" id="btnDown">▼</button>
                </div>

                <div class="game-hint" id="gameControlHint">SUPPORT KEYBOARD & TOUCH</div>
            </div>
        </div>
    </div>

    <script>
        // 切换复古模式逻辑（点击时钟触发）
        function toggleRetroMode() {
            document.body.classList.toggle('retro-mode');
        }

        // 时钟逻辑
        let clockTimezone = 'local';
        try { clockTimezone = localStorage.getItem('clockTimezone') || 'local'; } catch (e) {}

        // 获取当前时区的时/分/秒
        function getClockTimeParts() {
            if (clockTimezone === 'local') {
                const now = new Date();
                return {
                    hours: now.getHours(),
                    minutes: String(now.getMinutes()).padStart(2, '0'),
                    seconds: String(now.getSeconds()).padStart(2, '0')
                };
            }
            const parts = new Intl.DateTimeFormat('en-US', {
                timeZone: clockTimezone,
                hourCycle: 'h23',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            }).formatToParts(new Date());
            const get = (t) => (parts.find(p => p.type === t) || {}).value || '00';
            return {
                hours: parseInt(get('hour'), 10),
                minutes: get('minute'),
                seconds: get('second')
            };
        }

        function updateClock() {
            const { hours, minutes, seconds } = getClockTimeParts();

            const amIndicator = document.getElementById('am-indicator');
            const pmIndicator = document.getElementById('pm-indicator');

            if (hours < 12) {
                amIndicator.className = 'period-am active';
                pmIndicator.className = 'period-pm inactive';
            } else {
                amIndicator.className = 'period-am inactive';
                pmIndicator.className = 'period-pm active';
            }

            let h12 = hours % 12;
            h12 = h12 ? h12 : 12;
            const formattedHours = String(h12).padStart(2, '0');

            document.getElementById('clock').textContent = `${formattedHours}:${minutes}:${seconds}`;
        }

        // 时区列表（value 为 IANA 时区名，'local' 表示本地时间）
        const TIMEZONES = [
            { value: 'local', label: '本地时间' },
            { value: 'Asia/Shanghai', label: '北京' },
            { value: 'Asia/Hong_Kong', label: '香港' },
            { value: 'Asia/Taipei', label: '台北' },
            { value: 'Asia/Tokyo', label: '东京' },
            { value: 'Asia/Seoul', label: '首尔' },
            { value: 'Asia/Singapore', label: '新加坡' },
            { value: 'Asia/Bangkok', label: '曼谷' },
            { value: 'Asia/Kolkata', label: '新德里' },
            { value: 'Asia/Dubai', label: '迪拜' },
            { value: 'Europe/Moscow', label: '莫斯科' },
            { value: 'Europe/London', label: '伦敦' },
            { value: 'Europe/Paris', label: '巴黎' },
            { value: 'Europe/Berlin', label: '柏林' },
            { value: 'America/New_York', label: '纽约' },
            { value: 'America/Chicago', label: '芝加哥' },
            { value: 'America/Denver', label: '丹佛' },
            { value: 'America/Los_Angeles', label: '洛杉矶' },
            { value: 'America/Vancouver', label: '温哥华' },
            { value: 'America/Sao_Paulo', label: '圣保罗' },
            { value: 'Australia/Sydney', label: '悉尼' },
            { value: 'Pacific/Auckland', label: '奥克兰' },
            { value: 'Pacific/Honolulu', label: '檀香山' }
        ];

        function setClockTimezone(value) {
            clockTimezone = value;
            try { localStorage.setItem('clockTimezone', value); } catch (e) {}
            renderTimezoneButtons();
            updateClock();
        }

        function renderTimezoneButtons() {
            // 切换按钮上的文字显示当前选中的时区
            const labelEl = document.getElementById('clock-tz-label');
            if (labelEl) {
                const cur = TIMEZONES.find(t => t.value === clockTimezone);
                labelEl.textContent = cur ? cur.label : '本地时间';
            }
            const grid = document.getElementById('clock-tz-grid');
            if (!grid) return;
            grid.innerHTML = '';
            TIMEZONES.forEach(tz => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'tz-cell' + (tz.value === clockTimezone ? ' selected' : '');
                btn.textContent = tz.label;
                btn.addEventListener('click', () => setClockTimezone(tz.value));
                grid.appendChild(btn);
            });
        }

        function toggleTimezoneGrid() {
            const card = document.getElementById('clock-tz-card');
            if (card) card.classList.toggle('tz-collapsed');
        }

        // 日历状态
        let currentMode = 'day'; 
        let viewYear = new Date().getFullYear();
        let viewMonth = new Date().getMonth();

        function toggleCalendar() {
            const card = document.getElementById('calendar-card');
            card.classList.toggle('collapsed');
        }

        function updateCalendarView(actionCallback) {
            const card = document.getElementById('calendar-card');
            if (card.classList.contains('collapsed')) {
                card.classList.remove('collapsed');
            }

            const body = document.getElementById('calendar-body');
            body.classList.add('fade-out');

            setTimeout(() => {
                if (actionCallback) actionCallback();
                renderCalendar();
                body.classList.remove('fade-out');
            }, 200);
        }

        function switchMode(targetMode) {
            updateCalendarView(() => {
                currentMode = (currentMode === targetMode) ? 'day' : targetMode;
            });
        }

        function renderCalendar() {
            document.getElementById('title-year').textContent = `${viewYear}年`;
            document.getElementById('title-month').textContent = `${String(viewMonth + 1).padStart(2, '0')}月`;

            const body = document.getElementById('calendar-body');
            body.innerHTML = '';

            if (currentMode === 'day') renderDaysView(body);
            else if (currentMode === 'month') renderMonthsView(body);
            else if (currentMode === 'year') renderYearsView(body);
        }

        function renderDaysView(container) {
            const grid = document.createElement('div');
            grid.className = 'days-grid';

            const weekdays = [
                { name: '日', class: 'sun' }, { name: '月', class: '' },
                { name: '火', class: '' }, { name: '水', class: '' },
                { name: '木', class: '' }, { name: '金', class: '' },
                { name: '土', class: 'sat' }
            ];

            weekdays.forEach(w => {
                const tag = document.createElement('div');
                tag.className = `weekday-tag ${w.class}`.trim();
                tag.textContent = w.name;
                grid.appendChild(tag);
            });

            const realNow = new Date();
            const realYear = realNow.getFullYear();
            const realMonth = realNow.getMonth();
            const realDate = realNow.getDate();

            const firstDayOfMonth = new Date(viewYear, viewMonth, 1);
            const lastDayOfMonth = new Date(viewYear, viewMonth + 1, 0);

            const startWeekday = firstDayOfMonth.getDay(); 
            const totalDays = lastDayOfMonth.getDate();

            const prevMonthLastDay = new Date(viewYear, viewMonth, 0).getDate();
            for (let i = startWeekday - 1; i >= 0; i--) {
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.textContent = prevMonthLastDay - i;
                grid.appendChild(cell);
            }

            for (let day = 1; day <= totalDays; day++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell current-month';
                cell.textContent = day;
                if (viewYear === realYear && viewMonth === realMonth && day === realDate) {
                    cell.classList.add('today');
                }
                grid.appendChild(cell);
            }

            const currentTotalCells = grid.children.length - 7;
            const nextMonthDays = (currentTotalCells % 7 === 0) ? 0 : 7 - (currentTotalCells % 7);
            for (let i = 1; i <= nextMonthDays; i++) {
                const cell = document.createElement('div');
                cell.className = 'day-cell other-month';
                cell.textContent = i;
                grid.appendChild(cell);
            }

            container.appendChild(grid);
        }

        function renderMonthsView(container) {
            const grid = document.createElement('div');
            grid.className = 'months-grid';

            for (let m = 0; m < 12; m++) {
                const cell = document.createElement('div');
                cell.className = 'month-cell';
                if (m === viewMonth) cell.classList.add('selected');
                cell.textContent = `${String(m + 1).padStart(2, '0')}月`;
                cell.onclick = () => {
                    updateCalendarView(() => {
                        viewMonth = m;
                        currentMode = 'day';
                    });
                };
                grid.appendChild(cell);
            }

            container.appendChild(grid);
        }

        function renderYearsView(container) {
            const grid = document.createElement('div');
            grid.className = 'years-grid';

            const startYear = viewYear - 4;

            for (let i = 0; i < 9; i++) {
                const y = startYear + i;
                const cell = document.createElement('div');
                cell.className = 'year-cell';
                if (y === viewYear) cell.classList.add('selected');
                cell.textContent = `${y}年`;
                cell.onclick = () => {
                    updateCalendarView(() => {
                        viewYear = y;
                        currentMode = 'month';
                    });
                };
                grid.appendChild(cell);
            }

            container.appendChild(grid);
        }

        function handlePrev() {
            updateCalendarView(() => {
                if (currentMode === 'day') {
                    viewMonth--;
                    if (viewMonth < 0) {
                        viewMonth = 11;
                        viewYear--;
                    }
                } else if (currentMode === 'month') {
                    viewYear--;
                } else if (currentMode === 'year') {
                    viewYear -= 9;
                }
            });
        }

        function handleNext() {
            updateCalendarView(() => {
                if (currentMode === 'day') {
                    viewMonth++;
                    if (viewMonth > 11) {
                        viewMonth = 0;
                        viewYear++;
                    }
                } else if (currentMode === 'month') {
                    viewYear++;
                } else if (currentMode === 'year') {
                    viewYear += 9;
                }
            });
        }

        function resetToToday() {
            updateCalendarView(() => {
                const now = new Date();
                viewYear = now.getFullYear();
                viewMonth = now.getMonth();
                currentMode = 'day';
            });
        }

        // ==========================================================================
        // 街机小游戏 框架 (支持选择列表 & 游戏切换)
        // ==========================================================================
        let activeGameType = null; // 'runner' | 'doodle' | 'parade'
        let gameCanvas, ctx;
        let gameAnimationId;

        let keysPressed = {};
        let touchMoveState = { left: false, right: false };

        function openCatGame() {
            const modal = document.getElementById('gameModal');
            modal.classList.add('active');
            showGameMenu();
        }

        function closeCatGame() {
            const modal = document.getElementById('gameModal');
            modal.classList.remove('active');
            if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
            activeGameType = null;
        }

        function showGameMenu() {
            if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
            activeGameType = null;

            document.getElementById('gameMenuList').style.display = 'flex';
            document.getElementById('gameViewport').style.display = 'none';
            document.getElementById('touchControls').style.display = 'none';
            document.getElementById('dpadControls').style.display = 'none';
            document.getElementById('backMenuBtn').style.display = 'none';
            document.getElementById('gameModalTitle').textContent = "Arcade Select.exe";
        }

        function launchGame(type) {
            activeGameType = type;
            document.getElementById('gameMenuList').style.display = 'none';
            document.getElementById('gameViewport').style.display = 'flex';
            document.getElementById('backMenuBtn').style.display = 'inline-block';

            gameCanvas = document.getElementById('catGameCanvas');
            ctx = gameCanvas.getContext('2d');

            if (type === 'runner') {
                document.getElementById('touchControls').style.display = 'none';
                document.getElementById('dpadControls').style.display = 'none';
                document.getElementById('gameModalTitle').textContent = "Cat Runner.exe";
                document.getElementById('gameControlHint').textContent = "SPACE / UP / TOUCH TO JUMP";
                initRunnerGame();
            } else if (type === 'doodle') {
                document.getElementById('touchControls').style.display = 'flex';
                document.getElementById('dpadControls').style.display = 'none';
                document.getElementById('gameModalTitle').textContent = "Cat Doodle Jump.exe";
                document.getElementById('gameControlHint').textContent = "KEY A/D or LEFT/RIGHT | TOUCH BUTTONS BELOW";
                initDoodleGame();
            } else if (type === 'parade') {
                document.getElementById('touchControls').style.display = 'none';
                document.getElementById('dpadControls').style.display = 'grid';
                document.getElementById('gameModalTitle').textContent = "Cat Parade.exe";
                document.getElementById('gameControlHint').textContent = "WASD / ARROW KEYS / DPAD TO MOVE";
                initParadeGame();
            }
        }

        // 绑定实体触屏按钮事件
        function bindTouchButtonEvents() {
            const btnLeft = document.getElementById('btnLeft');
            const btnRight = document.getElementById('btnRight');

            const handlePress = (direction, isPressed) => {
                if (direction === 'left') touchMoveState.left = isPressed;
                if (direction === 'right') touchMoveState.right = isPressed;

                if (isPressed && activeGameType === 'doodle') {
                    handleDoodleTouchPress();
                }
            };

            ['touchstart', 'mousedown'].forEach(evtName => {
                btnLeft.addEventListener(evtName, (e) => { e.preventDefault(); handlePress('left', true); });
                btnRight.addEventListener(evtName, (e) => { e.preventDefault(); handlePress('right', true); });
            });

            ['touchend', 'touchcancel', 'mouseup', 'mouseleave'].forEach(evtName => {
                btnLeft.addEventListener(evtName, (e) => { e.preventDefault(); handlePress('left', false); });
                btnRight.addEventListener(evtName, (e) => { e.preventDefault(); handlePress('right', false); });
            });

            // 绑定十字键按键事件
            const dpadMap = [
                { id: 'btnUp', dir: 'up' },
                { id: 'btnDown', dir: 'down' },
                { id: 'btnDpadLeft', dir: 'left' },
                { id: 'btnDpadRight', dir: 'right' }
            ];

            dpadMap.forEach(item => {
                const btn = document.getElementById(item.id);
                ['touchstart', 'mousedown'].forEach(evtName => {
                    btn.addEventListener(evtName, (e) => {
                        e.preventDefault();
                        if (activeGameType === 'parade') {
                            handleParadeTouchPress(item.dir);
                        }
                    });
                });
            });
        }

        window.addEventListener('keydown', (e) => {
            keysPressed[e.code] = true;
            if (activeGameType === 'runner') handleRunnerAction(e);
            else if (activeGameType === 'doodle') handleDoodleAction(e);
            else if (activeGameType === 'parade') handleParadeAction(e);
        });

        window.addEventListener('keyup', (e) => {
            keysPressed[e.code] = false;
        });

        // 绘制像素猫咪（支持自然基因配色：毛色 & 眼睛）
        function drawPixelCat(x, y, isFacingLeft = false, furColor = '#444444', eyeColor = '#66ccff') {
            ctx.save();
            if (isFacingLeft) {
                ctx.translate(x + 24, y);
                ctx.scale(-1, 1);
                x = 0; y = 0;
            }
            
            // 身体
            ctx.fillStyle = furColor; 
            ctx.fillRect(x + 4, y + 8, 16, 10); 
            ctx.fillRect(x + 12, y + 2, 10, 10); 
            ctx.fillRect(x + 13, y, 3, 3); 
            ctx.fillRect(x + 18, y, 3, 3);
            
            // 眼睛
            ctx.fillStyle = eyeColor;
            ctx.fillRect(x + 19, y + 4, 2, 2); 
            
            // 尾巴
            ctx.fillStyle = furColor;
            ctx.fillRect(x, y + 4, 4, 3); 
            ctx.fillRect(x - 2, y + 2, 3, 3);

            ctx.restore();
        }

        // 自然界猫猫毛色与眼睛颜色池
        const NATURAL_FUR_COLORS = [
            '#444444', // 经典灰黑
            '#e67e22', // 橘猫
            '#2c3e50', // 纯黑猫
            '#ecf0f1', // 纯白猫
            '#95a5a6', // 蓝灰色 (英国短毛)
            '#d35400', // 深赭棕色
            '#f39c12', // 奶油黄
            '#7f8c8d'  // 烟灰色
        ];

        const NATURAL_EYE_COLORS = [
            '#66ccff', // 天蓝
            '#2ecc71', // 翡翠绿
            '#f1c40f', // 珀金黄
            '#e67e22', // 琥珀铜
            '#1abc9c'  // 青蓝
        ];

        function getRandomCatColors() {
            return {
                fur: NATURAL_FUR_COLORS[Math.floor(Math.random() * NATURAL_FUR_COLORS.length)],
                eye: NATURAL_EYE_COLORS[Math.floor(Math.random() * NATURAL_EYE_COLORS.length)]
            };
        }

        // ==========================================================================
        // 游戏 1：Cat Runner (横版奔跑)
        // ==========================================================================
        let runnerState = {};

        function initRunnerGame() {
            runnerState = {
                phase: 'POST', postStep: 0, postTimer: 0, phaseTimer: 0, transitionFlashTimer: 0,
                score: 0, highScore: runnerState.highScore || 0, speed: 2, frameCount: 0, nextSpawnFrame: 50,
                cat: {
                    x: 40, y: 210, width: 24, height: 24, vy: 0, gravity: 0.6, jumpPower: -9.5, isGrounded: true, legFrame: 0,
                    jump() { if (this.isGrounded) { this.vy = this.jumpPower; this.isGrounded = false; } },
                    update() {
                        this.vy += this.gravity; this.y += this.vy;
                        if (this.y >= 210) { this.y = 210; this.vy = 0; this.isGrounded = true; }
                        if (runnerState.frameCount % 6 === 0) this.legFrame = (this.legFrame + 1) % 2;
                    },
                    draw() {
                        drawPixelCat(this.x, this.y);
                        if (!this.isGrounded) {
                            ctx.fillStyle = '#444';
                            ctx.fillRect(this.x + 2, this.y + 18, 4, 4);
                            ctx.fillRect(this.x + 16, this.y + 18, 4, 4);
                        } else {
                            ctx.fillStyle = '#444';
                            if (this.legFrame === 0) {
                                ctx.fillRect(this.x + 5, this.y + 18, 3, 5);
                                ctx.fillRect(this.x + 15, this.y + 18, 3, 5);
                            } else {
                                ctx.fillRect(this.x + 8, this.y + 18, 3, 5);
                                ctx.fillRect(this.x + 12, this.y + 18, 3, 5);
                            }
                        }
                    }
                },
                obstacles: []
            };

            gameCanvas.onclick = (e) => handleRunnerAction(e);
            if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
            runnerLoop();
        }

        function handleRunnerAction(e) {
            if (activeGameType !== 'runner') return;
            if (e.type === 'keydown') {
                if (['Alt', 'Control', 'Meta', 'Shift', 'Tab', 'CapsLock'].includes(e.key)) return;
                if (e.code === 'Space' || e.code === 'ArrowUp') e.preventDefault();
            }

            const s = runnerState;
            if (s.phase === 'POST') { s.phase = 'TITLE'; s.phaseTimer = 0; }
            else if (s.phase === 'TITLE' || s.phase === 'DEMO') { s.phase = 'TRANSITION'; s.transitionFlashTimer = 0; }
            else if (s.phase === 'PLAYING') { s.cat.jump(); }
            else if (s.phase === 'GAMEOVER') { s.phase = 'TRANSITION'; s.transitionFlashTimer = 0; }
        }

        function runnerLoop() {
            if (activeGameType !== 'runner') return;
            const s = runnerState;
            s.frameCount++;
            ctx.fillStyle = '#f7f7f7'; ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

            if (s.phase === 'POST') {
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
                s.postTimer++;
                if (s.postTimer % 15 === 0 && s.postStep < 7) s.postStep++;
                ctx.fillStyle = '#00ff00'; ctx.font = "11px 'Share Tech Mono', monospace";
                const lines = [
                    "SAKI-SYSTEM ARCADE BOARD V2.6",
                    "CPU  : M68000 @ 12.5MHz ....... OK",
                    "SOUND: YM2610 @ 8.0MHz ........ OK",
                    "WORK RAM  0x00000-0x3FFFF ..... OK",
                    "VRAM TEST 0x00000-0x1FFFF ..... OK",
                    "SYSTEM ALL CLEAR!", "BOOTING CAT RUNNER..."
                ];
                for (let i = 0; i <= s.postStep && i < lines.length; i++) ctx.fillText(lines[i], 20, 30 + i * 18);
                if (s.postStep >= 6 && s.postTimer > 120) { s.phase = 'TITLE'; s.phaseTimer = 0; }
            } else if (s.phase === 'TITLE') {
                s.phaseTimer++;
                ctx.strokeStyle = '#ccc'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, 234); ctx.lineTo(gameCanvas.width, 234); ctx.stroke();
                s.cat.draw();

                if (Math.floor(s.phaseTimer / 20) % 2 === 0) {
                    ctx.fillStyle = '#111'; ctx.font = "bold 20px 'Silkscreen', monospace";
                    ctx.textAlign = 'center'; ctx.fillText("CAT RUNNER", gameCanvas.width / 2, 80);
                }
                if (Math.floor(s.phaseTimer / 15) % 2 === 0) {
                    ctx.fillStyle = '#e65100'; ctx.font = "11px 'Silkscreen', monospace";
                    ctx.textAlign = 'center'; ctx.fillText("PRESS ANY KEY TO PLAY", gameCanvas.width / 2, 120);
                }
                ctx.textAlign = 'left';
                if (s.phaseTimer > 180) { s.phase = 'DEMO'; s.obstacles = []; s.score = 0; s.speed = 3; s.frameCount = 0; s.nextSpawnFrame = 30; }
            } else if (s.phase === 'DEMO' || s.phase === 'PLAYING') {
                const isDemo = (s.phase === 'DEMO');
                ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, 234); ctx.lineTo(gameCanvas.width, 234); ctx.stroke();

                if (isDemo && s.cat.isGrounded) {
                    // 演示 AI：找到前方最近、尚未越过的障碍，在合适距离起跳，
                    // 使「障碍与猫重叠」的窗口落在猫跳跃顶点附近，从而稳定越过。
                    let target = null;
                    for (const obs of s.obstacles) {
                        if (obs.x + obs.width > s.cat.x) {
                            if (!target || obs.x < target.x) target = obs;
                        }
                    }
                    if (target) {
                        // 顶点到达帧数 ≈ |jumpPower| / gravity；起跳距离随速度自适应，
                        // 障碍重叠区间中心位于猫前方约 3px（由碰撞判定几何导出）。
                        const apexFrames = -s.cat.jumpPower / s.cat.gravity;
                        const jumpAt = s.cat.x + 3 + apexFrames * s.speed;
                        if (target.x <= jumpAt) s.cat.jump();
                    }
                }

                s.cat.update(); s.cat.draw();

                if (s.frameCount >= s.nextSpawnFrame) {
                    const isTall = Math.random() > 0.6;
                    const h = isTall ? 32 : 18;
                    s.obstacles.push({ x: gameCanvas.width, y: 234 - h, width: 18, height: h });
                    s.nextSpawnFrame = s.frameCount + Math.floor(160 / s.speed) + Math.floor(Math.random() * 40);
                }

                for (let i = s.obstacles.length - 1; i >= 0; i--) {
                    let obs = s.obstacles[i];
                    obs.x -= s.speed;
                    ctx.fillStyle = '#c68c53'; ctx.fillRect(obs.x, obs.y, obs.width, obs.height);

                    if (s.cat.x + 4 < obs.x + obs.width && s.cat.x + s.cat.width - 4 > obs.x &&
                        s.cat.y + 4 < obs.y + obs.height && s.cat.y + s.cat.height > obs.y) {
                        if (isDemo) { s.obstacles = []; s.score = 0; }
                        else { s.phase = 'GAMEOVER'; }
                    }

                    if (obs.x + obs.width < 0) {
                        s.obstacles.splice(i, 1);
                        s.score += 10;
                        if (!isDemo && s.score > s.highScore) s.highScore = s.score;
                        if (s.score % 100 === 0) s.speed += 0.5;
                    }
                }

                ctx.fillStyle = '#333'; ctx.font = "12px 'Share Tech Mono', monospace";
                ctx.fillText(`SCORE: ${s.score}`, gameCanvas.width - 100, 25);
                ctx.fillText(`HI: ${s.highScore}`, gameCanvas.width - 170, 25);

                if (isDemo && Math.floor(s.frameCount / 20) % 2 === 0) {
                    ctx.fillStyle = '#d32f2f'; ctx.font = "bold 14px 'Silkscreen', monospace";
                    ctx.textAlign = 'center'; ctx.fillText("--- DEMO MODE ---", gameCanvas.width / 2, 50);
                    ctx.textAlign = 'left';
                }
            } else if (s.phase === 'TRANSITION') {
                s.transitionFlashTimer++;
                ctx.fillStyle = (Math.floor(s.transitionFlashTimer / 4) % 2 === 0) ? '#ffffff' : '#79d2b3';
                ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
                ctx.fillStyle = '#000'; ctx.font = "bold 22px 'Silkscreen', monospace";
                ctx.textAlign = 'center'; ctx.fillText("READY!", gameCanvas.width / 2, gameCanvas.height / 2);
                ctx.textAlign = 'left';
                if (s.transitionFlashTimer > 30) {
                    s.phase = 'PLAYING'; s.obstacles = []; s.score = 0; s.speed = 3; s.frameCount = 0; s.nextSpawnFrame = 50;
                    s.cat.y = 210; s.cat.vy = 0;
                }
            } else if (s.phase === 'GAMEOVER') {
                ctx.strokeStyle = '#555'; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(0, 234); ctx.lineTo(gameCanvas.width, 234); ctx.stroke();
                s.cat.draw();
                ctx.fillStyle = '#333'; ctx.font = "16px 'Silkscreen', monospace"; ctx.textAlign = "center";
                ctx.fillText("GAME OVER", gameCanvas.width / 2, gameCanvas.height / 2 - 10);
                ctx.font = "10px 'Silkscreen', monospace";
                ctx.fillText("Press Any Key to Restart", gameCanvas.width / 2, gameCanvas.height / 2 + 15);
                ctx.textAlign = "left";
            }

            gameAnimationId = requestAnimationFrame(runnerLoop);
        }

        // ==========================================================================
        // 游戏 2：Cat Doodle Jump (涂鸦跳跃)
        // ==========================================================================
        let doodleState = {};

        function initDoodleGame() {
            doodleState = {
                phase: 'POST', postStep: 0, postTimer: 0, phaseTimer: 0, transitionFlashTimer: 0,
                score: 0, highScore: doodleState.highScore || 0,
                cat: { x: 228, y: 150, width: 24, height: 24, vx: 0, vy: 0, gravity: 0.14, jumpPower: -8.0, facingLeft: false },
                platforms: [], cameraY: 0
            };

            gameCanvas.onclick = () => handleDoodleTouchPress();
            if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
            doodleLoop();
        }

        function handleDoodleTouchPress() {
            if (activeGameType !== 'doodle') return;
            const s = doodleState;
            if (s.phase === 'POST') { s.phase = 'TITLE'; s.phaseTimer = 0; }
            else if (s.phase === 'TITLE' || s.phase === 'DEMO' || s.phase === 'GAMEOVER') {
                s.phase = 'TRANSITION'; s.transitionFlashTimer = 0;
            }
        }

        function handleDoodleAction(e) { handleDoodleTouchPress(); }

        function doodleLoop() {
            if (activeGameType !== 'doodle') return;
            const s = doodleState;
            ctx.fillStyle = '#faf8f0'; ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

            ctx.strokeStyle = '#f0ebd8'; ctx.lineWidth = 1;
            for (let x = 0; x < gameCanvas.width; x += 20) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, gameCanvas.height); ctx.stroke(); }
            for (let y = 0; y < gameCanvas.height; y += 20) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(gameCanvas.width, y); ctx.stroke(); }

            if (s.phase === 'POST') {
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
                s.postTimer++;
                if (s.postTimer % 15 === 0 && s.postStep < 6) s.postStep++;
                ctx.fillStyle = '#00ff00'; ctx.font = "11px 'Share Tech Mono', monospace";
                const lines = [
                    "DOODLE ENGINE V1.0",
                    "GRAVITY MOTOR CHECK ...... OK",
                    "PLATFORM GEN TEST ........ OK",
                    "BOUNCE SPRINGS .......... OK",
                    "BOOTING CAT DOODLE..."
                ];
                for (let i = 0; i <= s.postStep && i < lines.length; i++) ctx.fillText(lines[i], 20, 40 + i * 20);
                if (s.postStep >= 4 && s.postTimer > 100) { s.phase = 'TITLE'; s.phaseTimer = 0; }
            } else if (s.phase === 'TITLE') {
                s.phaseTimer++;
                drawPixelCat(228, 120);
                if (Math.floor(s.phaseTimer / 20) % 2 === 0) {
                    ctx.fillStyle = '#333'; ctx.font = "bold 18px 'Silkscreen', monospace";
                    ctx.textAlign = 'center'; ctx.fillText("CAT DOODLE JUMP", gameCanvas.width / 2, 80);
                }
                if (Math.floor(s.phaseTimer / 15) % 2 === 0) {
                    ctx.fillStyle = '#3a7bd5'; ctx.font = "11px 'Silkscreen', monospace";
                    ctx.textAlign = 'center'; ctx.fillText("PRESS ANY KEY / CLICK TO START", gameCanvas.width / 2, 170);
                }
                ctx.textAlign = 'left';
                if (s.phaseTimer > 180) { s.phase = 'DEMO'; resetDoodleWorld(); }
            } else if (s.phase === 'DEMO' || s.phase === 'PLAYING') {
                const isDemo = (s.phase === 'DEMO');

                if (!isDemo) {
                    const moveLeft = keysPressed['KeyA'] || keysPressed['ArrowLeft'] || touchMoveState.left;
                    const moveRight = keysPressed['KeyD'] || keysPressed['ArrowRight'] || touchMoveState.right;

                    if (moveLeft) { s.cat.vx = -3.0; s.cat.facingLeft = true; }
                    else if (moveRight) { s.cat.vx = 3.0; s.cat.facingLeft = false; }
                    else { s.cat.vx *= 0.97; }
                } else {
                    // 演示 AI：按上升/下落阶段选择目标平台并水平接近，保证持续向上弹跳
                    let target = null;
                    let best = Infinity;
                    const catCx = s.cat.x + 12;
                    if (s.cat.vy <= 0) {
                        // 上升阶段：瞄准上方 20~160px 内水平最近的平台
                        for (const p of s.platforms) {
                            const rise = s.cat.y - p.y; // 正 = 平台在上方
                            if (rise < 20 || rise > 160) continue;
                            const dx = Math.abs(catCx - (p.x + p.width / 2));
                            if (dx < best) { best = dx; target = p; }
                        }
                    } else {
                        // 下落阶段：瞄准下方最近的平台，确保踩到后继续弹跳
                        for (const p of s.platforms) {
                            if (p.y <= s.cat.y) continue;
                            const dx = Math.abs(catCx - (p.x + p.width / 2));
                            const dy = p.y - s.cat.y;
                            const score = dx + dy * 0.05;
                            if (score < best) { best = score; target = p; }
                        }
                    }
                    if (target) {
                        const targetCx = target.x + target.width / 2;
                        if (catCx < targetCx - 4) { s.cat.vx = 3.0; s.cat.facingLeft = false; }
                        else if (catCx > targetCx + 4) { s.cat.vx = -3.0; s.cat.facingLeft = true; }
                        else { s.cat.vx *= 0.9; }
                    }
                }

                s.cat.vy += s.cat.gravity; s.cat.x += s.cat.vx; s.cat.y += s.cat.vy;
                if (s.cat.x < -12) s.cat.x = gameCanvas.width - 12;
                if (s.cat.x > gameCanvas.width - 12) s.cat.x = -12;

                if (s.cat.y < 110) {
                    const diff = 110 - s.cat.y;
                    s.cat.y = 110; s.score += Math.floor(diff);
                    if (!isDemo && s.score > s.highScore) s.highScore = s.score;
                    s.platforms.forEach(p => p.y += diff);
                }

                if (s.cat.y > gameCanvas.height) {
                    if (isDemo) resetDoodleWorld(); else s.phase = 'GAMEOVER';
                }

                if (s.cat.vy > 0) {
                    s.platforms.forEach(p => {
                        if (s.cat.x + 4 < p.x + p.width && s.cat.x + s.cat.width - 4 > p.x &&
                            s.cat.y + s.cat.height >= p.y && s.cat.y + s.cat.height <= p.y + 12) {
                            s.cat.vy = p.isSpring ? s.cat.jumpPower * 1.35 : s.cat.jumpPower;
                        }
                    });
                }

                s.platforms = s.platforms.filter(p => p.y < gameCanvas.height);
                while (s.platforms.length < 9) {
                    const highestY = Math.min(...s.platforms.map(p => p.y));
                    s.platforms.push({
                        x: Math.random() * (gameCanvas.width - 60),
                        y: highestY - (25 + Math.random() * 25),
                        width: 58, height: 10, isSpring: Math.random() < 0.18
                    });
                }

                s.platforms.forEach(p => {
                    ctx.fillStyle = p.isSpring ? '#4caf50' : '#8d6e63'; ctx.fillRect(p.x, p.y, p.width, p.height);
                    ctx.fillStyle = p.isSpring ? '#2e7d32' : '#5d4037'; ctx.fillRect(p.x, p.y + p.height - 2, p.width, 2);
                });

                drawPixelCat(s.cat.x, s.cat.y, s.cat.facingLeft);

                ctx.fillStyle = '#333'; ctx.font = "12px 'Share Tech Mono', monospace";
                ctx.fillText(`HEIGHT: ${s.score}`, gameCanvas.width - 120, 25);
                ctx.fillText(`HI: ${s.highScore}`, gameCanvas.width - 200, 25);

                if (isDemo && Math.floor(Date.now() / 400) % 2 === 0) {
                    ctx.fillStyle = '#d32f2f'; ctx.font = "bold 14px 'Silkscreen', monospace";
                    ctx.textAlign = 'center'; ctx.fillText("--- DEMO MODE ---", gameCanvas.width / 2, 45);
                    ctx.textAlign = 'left';
                }
            } else if (s.phase === 'TRANSITION') {
                s.transitionFlashTimer++;
                ctx.fillStyle = (Math.floor(s.transitionFlashTimer / 4) % 2 === 0) ? '#ffffff' : '#79d2b3';
                ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
                ctx.fillStyle = '#000'; ctx.font = "bold 22px 'Silkscreen', monospace";
                ctx.textAlign = 'center'; ctx.fillText("JUMP!", gameCanvas.width / 2, gameCanvas.height / 2);
                ctx.textAlign = 'left';
                if (s.transitionFlashTimer > 30) { s.phase = 'PLAYING'; resetDoodleWorld(); }
            } else if (s.phase === 'GAMEOVER') {
                ctx.fillStyle = '#333'; ctx.font = "16px 'Silkscreen', monospace"; ctx.textAlign = "center";
                ctx.fillText("GAME OVER", gameCanvas.width / 2, gameCanvas.height / 2 - 10);
                ctx.font = "10px 'Silkscreen', monospace";
                ctx.fillText("Click / Press Button to Restart", gameCanvas.width / 2, gameCanvas.height / 2 + 15);
                ctx.textAlign = "left";
            }

            gameAnimationId = requestAnimationFrame(doodleLoop);
        }

        function resetDoodleWorld() {
            const s = doodleState;
            s.score = 0; s.cat.x = 228; s.cat.y = 150; s.cat.vx = 0; s.cat.vy = 0;
            s.platforms = [
                { x: 210, y: 220, width: 60, height: 10, isSpring: false },
                { x: 130, y: 180, width: 58, height: 10, isSpring: false },
                { x: 280, y: 140, width: 58, height: 10, isSpring: true },
                { x: 100, y: 100, width: 58, height: 10, isSpring: false },
                { x: 230, y: 60, width: 58, height: 10, isSpring: false },
                { x: 150, y: 20, width: 58, height: 10, isSpring: false }
            ];
        }

        // ==========================================================================
        // 游戏 3：Cat Parade (猫猫大游行 - 绝对方向控制 + 十字键)
        // ==========================================================================
        let paradeState = {};
        const GRID_SIZE = 24;
        const PARADE_CATCH_RADIUS = 1; // 收集野生猫咪的判定半径（格），越大越容易收集到同伴

        function initParadeGame() {
            paradeState = {
                phase: 'POST', postStep: 0, postTimer: 0, phaseTimer: 0, transitionFlashTimer: 0,
                score: 0, highScore: paradeState.highScore || 0,
                moveTimer: 0, speedInterval: 18, // 移动帧率隔帧
                dir: { x: 1, y: 0 }, // 当前移动方向
                nextDir: { x: 1, y: 0 }, // 下一次移动将改变的方向
                cats: [
                    { x: 5, y: 5, fur: '#444444', eye: '#66ccff' } // 主角猫咪
                ],
                wildCat: null
            };

            spawnWildCat();
            gameCanvas.onclick = () => handleParadeTouchPress('click');

            if (gameAnimationId) cancelAnimationFrame(gameAnimationId);
            paradeLoop();
        }

        function spawnWildCat() {
            const cols = Math.floor(gameCanvas.width / GRID_SIZE);
            const rows = Math.floor(gameCanvas.height / GRID_SIZE);

            let valid = false;
            let rx, ry;
            while (!valid) {
                // 同胞猫咪不生成在边缘一圈，只落在内部区域 [1, cols-2] × [1, rows-2]
                rx = 1 + Math.floor(Math.random() * (cols - 2));
                ry = 1 + Math.floor(Math.random() * (rows - 2));
                valid = !paradeState.cats.some(c => c.x === rx && c.y === ry);
            }

            const colors = getRandomCatColors();
            paradeState.wildCat = { x: rx, y: ry, fur: colors.fur, eye: colors.eye };
        }

        function setParadeDirection(targetDir) {
            const s = paradeState;
            if (s.phase !== 'PLAYING') return;

            // 绝对方向映射
            let newDir = null;
            if (targetDir === 'up') newDir = { x: 0, y: -1 };
            if (targetDir === 'down') newDir = { x: 0, y: 1 };
            if (targetDir === 'left') newDir = { x: -1, y: 0 };
            if (targetDir === 'right') newDir = { x: 1, y: 0 };

            if (newDir) {
                // 禁止 180 度直接反向移动（自吞防护）
                if (s.dir.x + newDir.x !== 0 || s.dir.y + newDir.y !== 0) {
                    s.nextDir = newDir;
                }
            }
        }

        function handleParadeTouchPress(action) {
            if (activeGameType !== 'parade') return;
            const s = paradeState;

            if (s.phase === 'POST') { s.phase = 'TITLE'; s.phaseTimer = 0; }
            else if (s.phase === 'TITLE' || s.phase === 'GAMEOVER') {
                s.phase = 'TRANSITION'; s.transitionFlashTimer = 0;
            } else if (s.phase === 'PLAYING') {
                setParadeDirection(action);
            }
        }

        function handleParadeAction(e) {
            if (activeGameType !== 'parade') return;
            const s = paradeState;

            if (s.phase === 'POST') { s.phase = 'TITLE'; s.phaseTimer = 0; }
            else if (s.phase === 'TITLE' || s.phase === 'GAMEOVER') {
                s.phase = 'TRANSITION'; s.transitionFlashTimer = 0;
            } else if (s.phase === 'PLAYING') {
                if (e.code === 'KeyW' || e.code === 'ArrowUp') setParadeDirection('up');
                if (e.code === 'KeyS' || e.code === 'ArrowDown') setParadeDirection('down');
                if (e.code === 'KeyA' || e.code === 'ArrowLeft') setParadeDirection('left');
                if (e.code === 'KeyD' || e.code === 'ArrowRight') setParadeDirection('right');
            }
        }

        function paradeLoop() {
            if (activeGameType !== 'parade') return;

            const s = paradeState;
            ctx.fillStyle = '#7f9a7a'; // 中灰绿底色：浅色与深色猫猫都能清晰辨认
            ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);

            // 绘制底板点阵
            ctx.fillStyle = '#6b8466';
            for (let x = 12; x < gameCanvas.width; x += GRID_SIZE) {
                for (let y = 12; y < gameCanvas.height; y += GRID_SIZE) {
                    ctx.fillRect(x - 1, y - 1, 2, 2);
                }
            }

            if (s.phase === 'POST') {
                ctx.fillStyle = '#000'; ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
                s.postTimer++;
                if (s.postTimer % 15 === 0 && s.postStep < 5) s.postStep++;
                ctx.fillStyle = '#00ff00'; ctx.font = "11px 'Share Tech Mono', monospace";
                const lines = [
                    "CAT PARADE ENGINE V2.0",
                    "COLOR GEN MATRIX ......... OK",
                    "WRAP AROUND BOUNDS ....... OK",
                    "BOOTING CAT PARADE..."
                ];
                for (let i = 0; i <= s.postStep && i < lines.length; i++) ctx.fillText(lines[i], 20, 50 + i * 20);
                if (s.postStep >= 3 && s.postTimer > 90) { s.phase = 'TITLE'; s.phaseTimer = 0; }
            } else if (s.phase === 'TITLE') {
                s.phaseTimer++;
                drawPixelCat(228, 110, false, '#444444', '#66ccff');
                if (Math.floor(s.phaseTimer / 20) % 2 === 0) {
                    ctx.fillStyle = '#ffffff'; ctx.font = "bold 18px 'Silkscreen', monospace";
                    ctx.textAlign = 'center'; ctx.fillText("CAT PARADE", gameCanvas.width / 2, 70);
                }
                if (Math.floor(s.phaseTimer / 15) % 2 === 0) {
                    ctx.fillStyle = '#ffffff'; ctx.font = "11px 'Silkscreen', monospace";
                    ctx.textAlign = 'center'; ctx.fillText("CLICK / PRESS BUTTON TO PLAY", gameCanvas.width / 2, 160);
                }
                ctx.textAlign = 'left';
            } else if (s.phase === 'PLAYING') {
                s.moveTimer++;

                if (s.moveTimer >= s.speedInterval) {
                    s.moveTimer = 0;
                    s.dir = { ...s.nextDir };

                    const cols = gameCanvas.width / GRID_SIZE;
                    const rows = gameCanvas.height / GRID_SIZE;

                    // 计算首领新位置 (包含边界安全穿透逻辑)
                    let newX = (s.cats[0].x + s.dir.x + cols) % cols;
                    let newY = (s.cats[0].y + s.dir.y + rows) % rows;

                    // 碰撞自身身体判定
                    const selfCollide = s.cats.slice(1).some(c => c.x === newX && c.y === newY);
                    if (selfCollide) {
                        s.phase = 'GAMEOVER';
                    } else {
                        // 移动队伍：后面的猫跟上前一节
                        for (let i = s.cats.length - 1; i > 0; i--) {
                            s.cats[i].x = s.cats[i - 1].x;
                            s.cats[i].y = s.cats[i - 1].y;
                        }
                        s.cats[0].x = newX;
                        s.cats[0].y = newY;

                        // 碰到野生猫咪 -> 增加队伍（判定范围扩大，更容易收集到同伴）
                        const dx = Math.abs(newX - s.wildCat.x);
                        const dy = Math.abs(newY - s.wildCat.y);
                        if (dx <= PARADE_CATCH_RADIUS && dy <= PARADE_CATCH_RADIUS) {
                            // 新同伴追加到队伍尾部，保持队伍连续
                            const tail = s.cats[s.cats.length - 1];
                            s.cats.push({
                                x: tail.x,
                                y: tail.y,
                                fur: s.wildCat.fur,
                                eye: s.wildCat.eye
                            });
                            s.score += 10;
                            if (s.score > s.highScore) s.highScore = s.score;
                            // 随着猫咪增多稍许加快游行速度
                            if (s.speedInterval > 8 && s.cats.length % 3 === 0) s.speedInterval--;
                            spawnWildCat();
                        }
                    }
                }

                // 绘制野生等待加入的猫咪 (微动动画)
                if (s.wildCat) {
                    const breathOffset = (Math.floor(Date.now() / 300) % 2 === 0) ? 0 : -1;
                    drawPixelCat(s.wildCat.x * GRID_SIZE, s.wildCat.y * GRID_SIZE + breathOffset, false, s.wildCat.fur, s.wildCat.eye);
                }

                // 绘制游行中的猫猫队伍
                for (let i = s.cats.length - 1; i >= 0; i--) {
                    const c = s.cats[i];
                    const isLeft = (s.dir.x === -1);
                    drawPixelCat(c.x * GRID_SIZE, c.y * GRID_SIZE, isLeft, c.fur, c.eye);
                }

                // 分数与统计
                ctx.fillStyle = '#ffffff'; ctx.font = "12px 'Share Tech Mono', monospace";
                ctx.fillText(`CATS: ${s.cats.length}`, gameCanvas.width - 100, 25);
                ctx.fillText(`HI: ${s.highScore}`, gameCanvas.width - 170, 25);
            } else if (s.phase === 'TRANSITION') {
                s.transitionFlashTimer++;
                ctx.fillStyle = (Math.floor(s.transitionFlashTimer / 4) % 2 === 0) ? '#ffffff' : '#a5d6a7';
                ctx.fillRect(0, 0, gameCanvas.width, gameCanvas.height);
                ctx.fillStyle = '#1b5e20'; ctx.font = "bold 22px 'Silkscreen', monospace";
                ctx.textAlign = 'center'; ctx.fillText("MARCH!", gameCanvas.width / 2, gameCanvas.height / 2);
                ctx.textAlign = 'left';
                if (s.transitionFlashTimer > 30) {
                    s.phase = 'PLAYING';
                    s.score = 0; s.speedInterval = 16; s.moveTimer = 0;
                    s.dir = { x: 1, y: 0 }; s.nextDir = { x: 1, y: 0 };
                    s.cats = [{ x: 5, y: 5, fur: '#444444', eye: '#66ccff' }];
                    spawnWildCat();
                }
            } else if (s.phase === 'GAMEOVER') {
                ctx.fillStyle = '#2e7d32'; ctx.font = "16px 'Silkscreen', monospace"; ctx.textAlign = "center";
                ctx.fillText("PARADE ENDED", gameCanvas.width / 2, gameCanvas.height / 2 - 10);
                ctx.font = "10px 'Silkscreen', monospace";
                ctx.fillText("Click / Press Button to March Again", gameCanvas.width / 2, gameCanvas.height / 2 + 15);
                ctx.textAlign = "left";
            }

            gameAnimationId = requestAnimationFrame(paradeLoop);
        }

        // ==========================================================================
        // AI 对话区域
        // ==========================================================================
        const AI_PROVIDERS = [
            { value: 'openai', label: 'OpenAI', baseUrl: 'https://api.openai.com/v1', custom: false },
            { value: 'deepseek', label: 'DeepSeek', baseUrl: 'https://api.deepseek.com/v1', custom: false },
            { value: 'moonshot', label: 'Moonshot (Kimi)', baseUrl: 'https://api.moonshot.cn/v1', custom: false },
            { value: 'glm', label: '智谱 GLM', baseUrl: 'https://open.bigmodel.cn/api/paas/v4', custom: false },
            { value: 'qwen', label: '通义千问', baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1', custom: false },
            { value: 'siliconflow', label: '硅基流动', baseUrl: 'https://api.siliconflow.cn/v1', custom: false },
            { value: 'custom', label: '自定义 (OpenAI 兼容)', baseUrl: '', custom: true }
        ];

        const AI_DEFAULTS = {
            provider: 'openai',
            baseUrl: 'https://api.openai.com/v1',
            apiKey: '',
            model: '',
            stream: true,
            temperature: 0.7,
            maxTokens: 1024,
            systemPrompt: '你是一只名叫 Saki 的小猫，用温柔可爱的语气和主人聊天。'
        };

        let aiConfig = { ...AI_DEFAULTS };
        try {
            const saved = localStorage.getItem('aiChatConfig');
            if (saved) aiConfig = { ...AI_DEFAULTS, ...JSON.parse(saved) };
        } catch (e) {}

        let customBaseUrlDraft = (aiConfig.provider === 'custom') ? aiConfig.baseUrl : '';
        let chatHistory = [];
        let aiBusy = false;

        function initAiArea() {
            const providerSel = document.getElementById('ai-provider');
            providerSel.innerHTML = '';
            AI_PROVIDERS.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.value;
                opt.textContent = p.label;
                providerSel.appendChild(opt);
            });
            providerSel.value = aiConfig.provider;
            syncAiProviderUI();
            document.getElementById('ai-api-key').value = aiConfig.apiKey || '';
            document.getElementById('ai-stream').checked = !!aiConfig.stream;
            updateAiStreamLabel();
            document.getElementById('ai-temperature').value = aiConfig.temperature;
            document.getElementById('ai-temp-value').textContent = Number(aiConfig.temperature).toFixed(1);
            document.getElementById('ai-max-tokens').value = aiConfig.maxTokens;
            document.getElementById('ai-system-prompt').value = aiConfig.systemPrompt || '';
            setAiModelOption(aiConfig.model);
        }

        function setAiModelOption(modelId) {
            if (!modelId) return;
            const sel = document.getElementById('ai-model');
            if (![...sel.options].some(o => o.value === modelId)) {
                const opt = document.createElement('option');
                opt.value = modelId;
                opt.textContent = modelId;
                sel.appendChild(opt);
            }
            sel.value = modelId;
        }

        function syncAiProviderUI() {
            const p = AI_PROVIDERS.find(x => x.value === document.getElementById('ai-provider').value) || AI_PROVIDERS[0];
            const urlInput = document.getElementById('ai-base-url');
            if (p.custom) {
                urlInput.disabled = false;
                urlInput.value = customBaseUrlDraft || '';
            } else {
                urlInput.disabled = true;
                urlInput.value = p.baseUrl || '';
            }
        }

        function getAiConfigFromInputs() {
            const p = AI_PROVIDERS.find(x => x.value === document.getElementById('ai-provider').value) || AI_PROVIDERS[0];
            let baseUrl = p.custom
                ? (document.getElementById('ai-base-url').value || '').trim()
                : (p.baseUrl || '');
            baseUrl = baseUrl.replace(/\/+$/, '');
            return {
                provider: p.value,
                baseUrl: baseUrl,
                apiKey: document.getElementById('ai-api-key').value.trim(),
                model: document.getElementById('ai-model').value.trim(),
                stream: document.getElementById('ai-stream').checked,
                temperature: parseFloat(document.getElementById('ai-temperature').value) || 0.7,
                maxTokens: parseInt(document.getElementById('ai-max-tokens').value, 10) || 1024,
                systemPrompt: document.getElementById('ai-system-prompt').value
            };
        }

        function updateAiStatus(msg) {
            const el = document.getElementById('ai-status');
            if (el) el.textContent = msg || '';
        }

        function updateAiTempLabel() {
            const v = document.getElementById('ai-temperature').value;
            document.getElementById('ai-temp-value').textContent = Number(v).toFixed(1);
        }

        function updateAiStreamLabel() {
            const checked = document.getElementById('ai-stream').checked;
            document.getElementById('ai-stream-label').textContent = checked ? '流式输出' : '非流式输出';
        }

        function expandAiAdvanced() {
            document.getElementById('ai-card').classList.remove('ai-adv-collapsed');
        }

        function toggleAiAdvanced() {
            document.getElementById('ai-card').classList.toggle('ai-adv-collapsed');
        }

        function toggleAiArea() {
            const card = document.getElementById('ai-card');
            if (card.classList.contains('chat-active')) {
                // 从聊天返回设置
                card.classList.remove('chat-active', 'ai-collapsed');
                expandAiAdvanced();
            } else {
                card.classList.toggle('ai-collapsed');
                if (!card.classList.contains('ai-collapsed')) expandAiAdvanced();
            }
        }

        function saveAiSettings() {
            aiConfig = getAiConfigFromInputs();
            if (aiConfig.provider === 'custom') customBaseUrlDraft = aiConfig.baseUrl;
            try { localStorage.setItem('aiChatConfig', JSON.stringify(aiConfig)); } catch (e) {}
            updateAiStatus('✅ 设置已保存');
        }

        function applyAiSettings() {
            const cfg = getAiConfigFromInputs();
            if (!cfg.apiKey) { updateAiStatus('⚠️ 请先填写 API Key'); return; }
            if (!cfg.baseUrl) { updateAiStatus('⚠️ 请填写服务商或 Base URL'); return; }
            if (!cfg.model) { updateAiStatus('⚠️ 请先获取并选择模型'); return; }
            aiConfig = cfg;
            if (cfg.provider === 'custom') customBaseUrlDraft = cfg.baseUrl;
            try { localStorage.setItem('aiChatConfig', JSON.stringify(aiConfig)); } catch (e) {}
            const card = document.getElementById('ai-card');
            card.classList.add('ai-collapsed', 'chat-active');
            updateAiStatus('');
            if (!chatHistory.length) {
                appendAiBubble('ai', '你好呀～我是 Saki，现在可以和我聊天啦！🐾');
            }
        }

        async function fetchModels() {
            const cfg = getAiConfigFromInputs();
            if (!cfg.apiKey) { updateAiStatus('⚠️ 请先填写 API Key'); return; }
            if (!cfg.baseUrl) { updateAiStatus('⚠️ 请填写服务商或 Base URL'); return; }
            const btn = document.getElementById('ai-fetch-btn');
            btn.disabled = true;
            btn.textContent = '获取中…';
            updateAiStatus('⏳ 正在获取模型列表…');
            try {
                const resp = await fetch(cfg.baseUrl + '/models', {
                    headers: { 'Authorization': 'Bearer ' + cfg.apiKey }
                });
                if (!resp.ok) throw new Error('HTTP ' + resp.status);
                const data = await resp.json();
                const ids = (data.data || []).map(m => m.id).filter(Boolean).sort();
                if (!ids.length) throw new Error('未返回任何模型');
                const sel = document.getElementById('ai-model');
                sel.innerHTML = '';
                ids.forEach(id => {
                    const opt = document.createElement('option');
                    opt.value = id;
                    opt.textContent = id;
                    sel.appendChild(opt);
                });
                setAiModelOption(cfg.model);
                updateAiStatus('✅ 获取到 ' + ids.length + ' 个模型，请选择');
            } catch (e) {
                updateAiStatus('❌ 获取模型失败：' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = '获取模型';
            }
        }

        function appendAiBubble(role, text) {
            const container = document.getElementById('ai-messages');
            const div = document.createElement('div');
            div.className = 'ai-bubble ' + (role === 'user' ? 'user' : 'ai');
            div.textContent = text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
            return div;
        }

        function scrollAiBottom() {
            const c = document.getElementById('ai-messages');
            c.scrollTop = c.scrollHeight;
        }

        async function safeErrorText(resp) {
            try { const t = await resp.text(); return t.slice(0, 200); } catch (e) { return ''; }
        }

        async function nonStreamChat(messages) {
            const body = {
                model: aiConfig.model,
                messages: messages,
                stream: false,
                temperature: aiConfig.temperature
            };
            if (aiConfig.maxTokens > 0) body.max_tokens = aiConfig.maxTokens;
            const resp = await fetch(aiConfig.baseUrl + '/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + aiConfig.apiKey },
                body: JSON.stringify(body)
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + (await safeErrorText(resp)));
            const data = await resp.json();
            return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
        }

        async function streamChat(messages, onDelta) {
            const body = {
                model: aiConfig.model,
                messages: messages,
                stream: true,
                temperature: aiConfig.temperature
            };
            if (aiConfig.maxTokens > 0) body.max_tokens = aiConfig.maxTokens;
            const resp = await fetch(aiConfig.baseUrl + '/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + aiConfig.apiKey },
                body: JSON.stringify(body)
            });
            if (!resp.ok) throw new Error('HTTP ' + resp.status + ' ' + (await safeErrorText(resp)));
            const reader = resp.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let full = '';
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                let idx;
                while ((idx = buffer.indexOf('\n')) >= 0) {
                    const line = buffer.slice(0, idx).trim();
                    buffer = buffer.slice(idx + 1);
                    if (!line.startsWith('data:')) continue;
                    const payload = line.slice(5).trim();
                    if (!payload || payload === '[DONE]') continue;
                    try {
                        const json = JSON.parse(payload);
                        const delta = json.choices && json.choices[0] && json.choices[0].delta && json.choices[0].delta.content;
                        if (delta) { full += delta; onDelta(full); }
                    } catch (e) {}
                }
            }
            return full;
        }

        async function sendAiMessage() {
            if (aiBusy) return;
            const input = document.getElementById('ai-input');
            const text = input.value.trim();
            if (!text) return;
            input.value = '';

            appendAiBubble('user', text);
            chatHistory.push({ role: 'user', content: text });
            if (chatHistory.length > 40) chatHistory = chatHistory.slice(-40);

            const aiBubble = appendAiBubble('ai', '');
            aiBubble.classList.add('loading');
            aiBubble.textContent = '思考中…';

            aiBusy = true;
            const sendBtn = document.getElementById('ai-send-btn');
            sendBtn.disabled = true;

            const messages = [];
            if (aiConfig.systemPrompt) messages.push({ role: 'system', content: aiConfig.systemPrompt });
            messages.push(...chatHistory);

            try {
                let full = '';
                if (aiConfig.stream) {
                    full = await streamChat(messages, (acc) => {
                        aiBubble.textContent = acc;
                        aiBubble.classList.remove('loading');
                        scrollAiBottom();
                    });
                } else {
                    full = await nonStreamChat(messages);
                }
                aiBubble.classList.remove('loading');
                aiBubble.textContent = full || '(空回复)';
                chatHistory.push({ role: 'assistant', content: full });
            } catch (e) {
                aiBubble.classList.remove('loading');
                aiBubble.textContent = '请求失败：' + e.message;
            } finally {
                aiBusy = false;
                sendBtn.disabled = false;
                scrollAiBottom();
            }
        }

        // 初始化页面与按键绑定
        bindTouchButtonEvents();
        renderTimezoneButtons();
        updateClock();
        renderCalendar();
        initAiArea();
        setInterval(updateClock, 1000);
    </script>
</body>
</html>
